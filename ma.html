<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>1Gestão | Manutenção</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#0f172a;
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
}

.container{
background:#1e293b;
padding:40px;
border-radius:12px;
width:500px;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h1{
font-size:32px;
margin-bottom:10px;
}

p{
color:#cbd5f5;
}

.icon{
font-size:60px;
margin-bottom:20px;
}

.progress{
margin-top:25px;
background:#020617;
border-radius:20px;
overflow:hidden;
height:15px;
}

.bar{
height:100%;
width:65%;
background:#22c55e;
animation:load 3s infinite;
}

@keyframes load{
0%{width:30%}
50%{width:70%}
100%{width:40%}
}

.footer{
margin-top:25px;
font-size:13px;
color:#94a3b8;
}

</style>

</head>
<body>

<div class="container">

<div class="icon">⚙️</div>

<h1>1Gestão em Manutenção</h1>

<p>
Estamos realizando melhorias no sistema.<br>
Voltaremos em breve com uma versão mais estável e rápida.
</p>

<div class="progress">
<div class="bar"></div>
</div>

<div class="footer">
© 1Gestão - Sistema temporariamente indisponível
</div>

</div>

</body>
</html>
